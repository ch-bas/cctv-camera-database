name: build

on:
  push:
    branches: [main]
  pull_request:

# contents: write lets the main-branch run commit regenerated artifacts back.
# The pages job overrides this with its own (read-only) permissions block.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: build.js derives each camera's `added` date from
          # `git log --diff-filter=A`; a shallow clone would compute different
          # dates. Also needed so the main-branch run can commit + push.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm ci

      # This validates every camera against the schema (AJV) and fails on any
      # invalid entry — that is the gate for pull requests. Contributors only
      # ever touch source files (cameras/, schema/, glossary.md); they do NOT
      # need to run a build or commit generated artifacts.
      - name: Validate & build dataset
        run: node scripts/build.js
      - name: Generate docs
        run: node scripts/gen-docs.js

      # On push to main, keep the committed artifacts (data/, docs/) in sync by
      # regenerating and committing them here — so no contributor or maintainer
      # ever has to. Skipped on pull_request (validation above is the only gate).
      # The [skip ci] tag stops this commit from re-triggering workflows.
      - name: Sync generated artifacts (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if [ -z "$(git status --porcelain data/ docs/)" ]; then
            echo "Generated artifacts already up to date — nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ docs/
          git commit -m "chore: regenerate data/docs artifacts [skip ci]"
          if git push; then
            echo "Regenerated artifacts committed to main."
          else
            echo "::error::Could not push regenerated artifacts to main. Allow \
              github-actions[bot] to bypass the branch-protection 'require a pull \
              request' rule (Settings → Branches), or regenerate manually with \
              'npm run build' and commit."
            exit 1
          fi

  pages:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm ci
      - name: Build dataset
        run: node scripts/build.js
      - name: Copy data into docs for Pages
        run: cp data/cameras.json docs/cameras.json
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
